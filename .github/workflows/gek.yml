name: gek
on:
  pull_request:
  push:
    branches: [main]
jobs:
  gek:
    runs-on: [self-hosted, gek-host]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gek-mechanical
        run: cd "$GITHUB_WORKSPACE" && GEK_HOME=/home/leviathan/JARVIS_WORKSPACE/Shared_Workspace/GEK bun "$GEK_HOME/src/cli.ts" check . --check=mechanical
      - name: gek-identity
        run: cd "$GITHUB_WORKSPACE" && GEK_HOME=/home/leviathan/JARVIS_WORKSPACE/Shared_Workspace/GEK bun "$GEK_HOME/src/cli.ts" check . --check=identity
      - name: gek-judge
        run: |
          set -x
          which bun; bun --version
          cd "$GITHUB_WORKSPACE"
          ls -la thresholds.json GEK.lock gate-spec.json
          GEK_HOME=/home/leviathan/JARVIS_WORKSPACE/Shared_Workspace/GEK
          bun "$GEK_HOME/src/cli.ts" check . --check=judge 2>&1 | tee /tmp/gek-judge-debug.log
          echo "JUDGE_EXIT=$?"
