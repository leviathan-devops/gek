name: gek
on:
  pull_request:
  push:
    branches: [main]
jobs:
  gek-mechanical:
    runs-on: [self-hosted, gek-host]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: cd "$GITHUB_WORKSPACE" && export GEK_HOME=/home/leviathan/JARVIS_WORKSPACE/Shared_Workspace/GEK && /home/leviathan/.bun/bin/bun "$GEK_HOME/src/cli.ts" check . --base="${GITHUB_BASE_REF:-origin/main}" --check=mechanical
  gek-identity:
    needs: [gek-mechanical]
    runs-on: [self-hosted, gek-host]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: cd "$GITHUB_WORKSPACE" && export GEK_HOME=/home/leviathan/JARVIS_WORKSPACE/Shared_Workspace/GEK && /home/leviathan/.bun/bin/bun "$GEK_HOME/src/cli.ts" check . --base="${GITHUB_BASE_REF:-origin/main}" --check=identity
  gek-judge:
    needs: [gek-identity]
    runs-on: [self-hosted, gek-host]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: |
          cd "$GITHUB_WORKSPACE"
          export GEK_HOME=/home/leviathan/JARVIS_WORKSPACE/Shared_Workspace/GEK
          { echo "HOME=$HOME TEMP=$RUNNER_TEMP"; pwd; ls -la; bun "$GEK_HOME/src/cli.ts" check . --base="${GITHUB_BASE_REF:-origin/main}" --check=judge; echo "GEK_JUDGE_STEP_EXIT=$?"; } > "$HOME/gek-debug-judge.txt" 2>&1
          cat "$HOME/gek-debug-judge.txt"
          grep -q "GEK_JUDGE_STEP_EXIT=0" "$HOME/gek-debug-judge.txt"
