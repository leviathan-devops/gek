name: gek
on:
  pull_request:
  push:
    branches: [main]
jobs:
  gek-mechanical:
    runs-on: [self-hosted, gek-host]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: cd "$GITHUB_WORKSPACE" && GEK_HOME=/home/leviathan/JARVIS_WORKSPACE/Shared_Workspace/GEK bun "$GEK_HOME/src/cli.ts" check . --check=mechanical
  gek-identity:
    needs: [gek-mechanical]
    runs-on: [self-hosted, gek-host]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: cd "$GITHUB_WORKSPACE" && GEK_HOME=/home/leviathan/JARVIS_WORKSPACE/Shared_Workspace/GEK bun "$GEK_HOME/src/cli.ts" check . --check=identity
  gek-judge:
    needs: [gek-identity]
    runs-on: [self-hosted, gek-host]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: cd "$GITHUB_WORKSPACE" && GEK_HOME=/home/leviathan/JARVIS_WORKSPACE/Shared_Workspace/GEK bun "$GEK_HOME/src/cli.ts" check . --check=judge
